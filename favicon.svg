<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="wwsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wwsAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#wwsGradient)" />
  <!-- WWS Monogram -->
  <text x="512" y="580" font-family="Sora, Manrope, sans-serif" font-weight="800" font-size="320" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.05em">WWS</text>
  <!-- Chile badge -->
  <text x="512" y="800" font-family="Sora, Manrope, sans-serif" font-weight="600" font-size="72" fill="url(#wwsAccentGradient)" text-anchor="middle" dominant-baseline="central">CHILE</text>
  <!-- Flag accent line -->
  <rect x="312" y="840" width="400" height="8" fill="url(#wwsAccentGradient)" rx="4" />
  <rect x="312" y="856" width="400" height="8" fill="#ffffff" rx="4" opacity="0.3" />
  <rect x="312" y="872" width="400" height="8" fill="url(#wwsGradient)" rx="4" />
</svg>